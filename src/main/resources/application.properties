spring.application.name=job-portal-management

# Default PostgreSQL settings for pgAdmin 4 / local PostgreSQL.
# Override with DB_URL, DB_USERNAME, DB_PASSWORD, or DB_DRIVER if needed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/job_portal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080
